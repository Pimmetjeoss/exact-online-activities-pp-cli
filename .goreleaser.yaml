version: 2
project_name: exact-online-activities-pp-cli
changelog:
  disable: true
builds:
  - id: exact-online-activities-pp-cli
    main: ./cmd/exact-online-activities-pp-cli
    binary: exact-online-activities-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X exact-online-activities-pp-cli/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: exact-online-activities-pp-mcp
    main: ./cmd/exact-online-activities-pp-mcp
    binary: exact-online-activities-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: exact-online-activities-pp-cli
    repository:
      owner: 
      name: homebrew-tap
    homepage: "https://github.com//exact-online-activities-pp-cli"
    description: "Activities-only Exact Online REST/OData API surface generated from the official Exact Online REST API documentation."
    install: |
      bin.install "exact-online-activities-pp-cli"
      bin.install "exact-online-activities-pp-mcp"
